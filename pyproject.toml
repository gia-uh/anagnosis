[project]
name = "anagnosis"
version = "0.1.0"
description = "Multi-dimensional reading complexity for Spanish and English texts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "spacy>=3.8,<3.9",
    "es-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "wordfreq>=3",
    "cmudict>=1.0",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.scripts]
anagnosis = "anagnosis.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/anagnosis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
